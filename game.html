<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Game</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        html, body {
            background: #000;
            color: #fff;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
        }
        canvas {
            touch-action: none;
            -ms-touch-action: none;
        }
    </style>
</head>
<body>
    <!-- The canvas for rendering the game -->
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="640" height="640">
            <!-- Fallback text for browsers that don't support HTML5 -->
            <h1>Your browser does not appear to support HTML5. Please upgrade your browser.</h1>
        </canvas>
    </div>
    
    <!-- Include required scripts -->
    <script src="jquery-3.4.1.min.js"></script>
    <script src="GameAnalytics.js"></script>
    <script src="Tween.js"></script>
    <script src="html2canvas.min.js"></script>
    <script src="jquery.gritter.js"></script>
    <script src="howler.js"></script>
    <script src="c2runtime.js"></script>
    
    <script>
        // Start the Construct 2 project running on window load
        jQuery(document).ready(function() {
            cr_createRuntime("c2canvas");
        });

        // Pause and resume game when the page visibility changes
        function onVisibilityChanged() {
            if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden) {
                cr_setSuspended(true);
            } else {
                cr_setSuspended(false);
            }
        }

        document.addEventListener("visibilitychange", onVisibilityChanged, false);
        document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

        // Register service worker for offline support
        function OnRegisterSWError(e) {
            console.warn("Failed to register service worker: ", e);
        }

        window.C2_RegisterSW = function C2_RegisterSW() {
            if (!navigator.serviceWorker) return; // No SW support, ignore call

            try {
                navigator.serviceWorker.register("sw.js", { scope: "./" })
                    .then(function (reg) {
                        console.log("Registered service worker on " + reg.scope);
                    })
                    .catch(OnRegisterSWError);
            } catch (e) {
                OnRegisterSWError(e);
            }
        };
    </script>
    <script type="text/javascript">
        var VERSION = VERSION || (function() {
            return {
                version: function() {
                    return "CTLE";
                },
                skinVersion: function() {
                    return "1.4.4";
                },
            };
        }());
    </script>
</body>
</html>
